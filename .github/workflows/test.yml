name: Tests

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Zig 0.16 tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build application and dashboard
        run: zig build

      - name: Run tests
        run: zig build test

      - name: Install pinned Lightpanda
        run: |
          curl -fsSL https://pkg.lightpanda.io/install.sh | bash -s "1.0.3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run real CDP browser smoke test
        env:
          ITI_CUSTOMER_EMAIL: smoke@example.com
        run: zig build run -Dspec=examples/e2e-smoke.iti -Dprofile=standard -Dui=ndjson

      - name: Lightpanda diagnostics
        if: always()
        run: |
          curl -sv http://127.0.0.1:9222/json/version || true
          tail -100 /tmp/iti-lightpanda.log || true

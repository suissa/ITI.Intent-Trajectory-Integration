name: Tests

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Zig 0.16 tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build application and dashboard
        run: zig build

      - name: Run tests
        run: zig build test

      - name: Install pinned Lightpanda
        run: |
          curl -fsSL https://pkg.lightpanda.io/install.sh | bash -s "1.0.3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Start Lightpanda and probe CDP with Node
        run: |
          LIGHTPANDA_DISABLE_TELEMETRY=true nohup lightpanda serve --host 127.0.0.1 --port 9222 >/tmp/iti-lightpanda.log 2>&1 </dev/null &
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
            sleep 0.1
          done
          node -e 'const ws = new WebSocket("ws://127.0.0.1:9222/"); const timer = setTimeout(() => { console.error("CDP probe timeout"); process.exit(1); }, 5000); ws.addEventListener("open", () => ws.send(JSON.stringify({ id: 1, method: "Browser.getVersion", params: {} }))); ws.addEventListener("message", event => { console.log(String(event.data)); clearTimeout(timer); ws.close(); process.exit(0); }); ws.addEventListener("error", error => { console.error(error); clearTimeout(timer); process.exit(1); });'

      - name: Run real CDP browser smoke test
        env:
          ITI_CUSTOMER_EMAIL: smoke@example.com
        run: |
          set -o pipefail
          zig build run -Dspec=examples/e2e-smoke.iti -Dprofile=standard -Dui=ndjson 2>&1 | tee /tmp/iti-smoke.log
          grep -q '"kind":"benchmark_sample"' /tmp/iti-smoke.log
          grep -q '"kind":"assertion_passed"' /tmp/iti-smoke.log

      - name: Lightpanda diagnostics
        if: always()
        run: |
          curl -sv http://127.0.0.1:9222/json/version || true
          tail -100 /tmp/iti-lightpanda.log || true

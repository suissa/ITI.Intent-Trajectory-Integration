name: Tests

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

jobs:
  test:
    name: Zig 0.16 tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run tests
        run: zig build test
